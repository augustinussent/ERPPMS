name: Hotel PMS CI
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python ci/run_static_checks.py
      - run: python ci/run_contract_checks.py
      - run: python ci/run_rc2_contract_checks.py
      - run: python ci/run_rc3_contract_checks.py
      - run: python ci/run_rc4_contract_checks.py
      - run: python ci/run_rc5_contract_checks.py
      - run: python ci/run_rc6_contract_checks.py
      - run: python ci/run_rc7_contract_checks.py
      - run: python ci/run_rc8_contract_checks.py
      - run: python ci/run_rc9_contract_checks.py
      - run: python -m py_compile ci/run_concurrency_gate.py ci/run_performance_gate.py ci/build_evidence_manifest.py ci/verify_staging_bundle.py
      - run: python ci/generate_api_docs.py --check
      - run: python -m pytest -q hotel_pms/tests/test_front_desk_rules.py hotel_pms/tests/test_guest_rules.py hotel_pms/tests/test_operations_rules.py hotel_pms/tests/test_revenue_rules.py hotel_pms/tests/test_services_rules.py hotel_pms/tests/test_platform_rules.py hotel_pms/tests/test_production_gate_rules.py hotel_pms/tests/test_adoption_rc2.py hotel_pms/tests/test_fnb_rc3_rules.py hotel_pms/tests/test_production_validation_rules.py hotel_pms/tests/test_staging_execution_rules.py hotel_pms/tests/test_intelligence_rc6_rules.py hotel_pms/tests/test_intelligence_rc7_rules.py hotel_pms/tests/test_distribution_rc8_rules.py hotel_pms/tests/test_distribution_rc8_contract.py hotel_pms/tests/test_restaurant_controls_rc9_rules.py hotel_pms/tests/test_restaurant_controls_rc9_contract.py
  bench-integration:
    if: vars.RUN_FRAPPE_INTEGRATION == 'true'
    runs-on: [self-hosted, frappe-v16]
    steps:
      - uses: actions/checkout@v4
      - run: ci/run_bench_tests.sh
      - run: ci/run_rc7_bench_smoke.sh
      - run: ci/run_rc8_bench_smoke.sh
      - run: ci/run_rc9_bench_smoke.sh
