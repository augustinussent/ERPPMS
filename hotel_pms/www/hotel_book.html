{% extends "templates/web.html" %}{% block title %}{{ title }}{% endblock %}{% block page_content %}
<div class="hotel-public" id="hotel-book-app"><div class="hotel-hero" id="public-hero"><h1 id="property-name">{{ _("Direct Hotel Booking") }}</h1><p id="property-tagline"></p><p id="property-description"></p></div><div id="property-gallery" class="hotel-grid"></div>
<div class="hotel-form"><label>Property slug<input id="property-slug" value="{{ property_slug }}"></label><label>Arrival<input id="arrival" type="date"></label><label>Departure<input id="departure" type="date"></label><label>Adults per room<input id="adults" type="number" min="1" value="2"></label><label>Children per room<input id="children" type="number" min="0" value="0"></label><label>Voucher<input id="voucher"></label></div>
<button class="hotel-btn" id="search-btn">Search availability</button><div id="message"></div><div id="results" class="hotel-grid"></div>
<div id="booking" class="hotel-card" style="display:none;margin-top:18px"><h3>Guest details</h3><div class="hotel-form"><label>Full name<input id="guest-name"></label><label>Email<input id="email" type="email"></label><label>Phone<input id="phone"></label><label>Rooms<input id="quantity" type="number" min="1" value="1"></label><label class="hotel-honeypot">Company website<input id="company-website" tabindex="-1" autocomplete="off"></label></div><details><summary>Hotel policies</summary><p id="public-policies"></p></details><details><summary>Booking terms</summary><p id="public-terms"></p></details><details><summary>Privacy notice</summary><p id="public-privacy"></p></details><label><input type="checkbox" id="terms"> I accept hotel terms</label><br><label><input type="checkbox" id="privacy"> I accept the privacy notice</label><br><br><button class="hotel-btn" id="book-btn">Confirm booking</button></div><div class="hotel-card" id="public-info" style="display:none"><h3>Information</h3><p id="public-faq"></p><p><a id="public-map" target="_blank" rel="noopener noreferrer">Map and directions</a></p></div></div>
<script>window.hotelPropertySlug={{ property_slug|tojson }};</script><script src="/assets/hotel_pms/js/hotel_book.js"></script>
{% endblock %}
